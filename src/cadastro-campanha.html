<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IndoorView - Nova Campanha</title>

    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>

  <body>
    <header>
      <h1>IndoorView</h1>
      <p>Sistema de Gerenciamento de Mídia Indoor</p>

      <nav aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="campanhas.html">Campanhas</a>
        <a href="cadastro-campanha.html" aria-current="page">Nova Campanha</a>
      </nav>
    </header>

    <main>
      <section class="form-section">
        <h2>Cadastro de campanha</h2>

        <p>Preencha os campos obrigatórios. A descrição é opcional.</p>
        <p id="aviso-dados" role="status"></p>
        <p id="mensagem" role="status" tabindex="-1"></p>
        <form id="form-campanha" novalidate>
          <div>
            <label for="nome">Nome da campanha</label>
            <input
              type="text"
              id="nome"
              name="nome"
              required maxlength="80" aria-describedby="erro-nome"
              placeholder="Ex: Campanha Academia Fit"
            />
            <span class="erro-campo" id="erro-nome"></span>
          </div>

          <div>
            <label for="anunciante">Anunciante</label>
            <input
              type="text"
              id="anunciante"
              name="anunciante"
              required maxlength="80" aria-describedby="erro-anunciante"
              placeholder="Nome do anunciante"
            />
            <span class="erro-campo" id="erro-anunciante"></span>
          </div>

          <div>
            <label for="descricao">Descrição</label>
            <textarea
              id="descricao"
              name="descricao"
              rows="4"
              maxlength="500" aria-describedby="erro-descricao"
              placeholder="Descrição da campanha"
            ></textarea>
            <span class="erro-campo" id="erro-descricao"></span>
          </div>

          <div>
            <label for="data-inicio">Data de início</label>
            <input type="date" id="data-inicio" name="data-inicio" required aria-describedby="erro-data-inicio" />
            <span class="erro-campo" id="erro-data-inicio"></span>
          </div>

          <div>
            <label for="data-fim">Data de término</label>
            <input type="date" id="data-fim" name="data-fim" required aria-describedby="erro-data-fim" />
            <span class="erro-campo" id="erro-data-fim"></span>
          </div>

          <div>
            <label for="estabelecimento">Estabelecimento</label>

            <select id="estabelecimento" name="estabelecimento" required aria-describedby="erro-estabelecimento">
              <option value="">Selecione um estabelecimento</option>
              <option value="academia">Academia Power Fit</option>
              <option value="mercado">Mercado Central</option>
              <option value="shopping">Shopping Centro</option>
            </select>
            <span class="erro-campo" id="erro-estabelecimento"></span>
          </div>

          <div>
            <label for="status">Status</label>

            <select id="status" name="status" required aria-describedby="erro-status">
              <option value="futura">Futura</option>
              <option value="ativa">Ativa</option>
              <option value="encerrada">Encerrada</option>
            </select>
            <span class="erro-campo" id="erro-status"></span>
          </div>

          <button type="submit">Cadastrar campanha</button>
        </form>
        <p class="link-listagem"><a href="campanhas.html">Consultar campanhas cadastradas</a></p>
        <noscript>Ative o JavaScript para cadastrar campanhas.</noscript>
      </section>
    </main>

    <footer>
      <p>IndoorView - Tecnologia de Construção de Software I</p>
    </footer>
  </body>
</html>
